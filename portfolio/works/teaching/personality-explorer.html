<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>认识彼此 · 课堂性格探索</title>
<style>
:root{--ink:#183c40;--green:#255f59;--paper:#f6f4ee;--soft:#e8ede7;--muted:#60716c;--line:#d6ded6;--gold:#a77835}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;font-size:17px;line-height:1.65}header{max-width:1100px;margin:auto;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}header strong{font-size:18px}button,select{font:inherit}button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:white;color:var(--ink);padding:11px 22px;transition:.15s}button:hover{border-color:var(--green);background:#eef3ec}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#174c47}.plain{border:0;background:none;padding:5px 8px}main{max-width:1000px;margin:0 auto;padding:48px 28px 70px}h1{font-size:clamp(34px,5vw,58px);line-height:1.22;letter-spacing:-1px;margin:12px 0 24px}h2{font-size:clamp(24px,3vw,34px);line-height:1.5;margin:16px 0 24px}h3{margin:0 0 8px}.eyebrow{font-size:13px;color:var(--gold);letter-spacing:2px;font-weight:700}.lead{font-size:21px;max-width:730px}.muted{color:var(--muted)}.note{font-size:14px;color:var(--muted)}.split{display:grid;grid-template-columns:1.6fr 1fr;gap:50px;align-items:start}.aside{border-top:3px solid var(--green);padding:22px 0}.aside p{font-size:16px}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:30px}.mode{border:0;padding:0;margin:30px 0}select{max-width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}progress{width:100%;height:8px;accent-color:var(--green)}.qmeta{display:flex;justify-content:space-between;margin-bottom:10px;color:var(--muted);font-size:14px}.situation{font-size:15px;color:var(--gold);font-weight:650}.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:22px 0}.pair>div{border-top:2px solid var(--line);padding-top:14px}.pair strong{font-size:14px;color:var(--green)}.pair p{margin:8px 0;font-size:20px}.options{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:30px}.choice{padding:18px 10px;min-height:90px}.choice[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green);box-shadow:0 0 0 3px #255f5920}.choice span{display:block;font-size:13px;margin-top:3px}.nav{display:flex;justify-content:space-between;margin-top:30px;gap:12px}.backlink{margin-top:28px}.type{font-size:66px;line-height:1.2;font-weight:760;letter-spacing:8px;margin:14px 0}.resultlead{max-width:760px}.dimension{padding:22px 0;border-bottom:1px solid var(--line)}.dimtop{display:flex;justify-content:space-between;gap:20px;align-items:center}.dimtop b{font-size:20px}.track{position:relative;height:12px;background:#dce5dc;border-radius:20px;margin:18px 0 8px}.track:before{content:'';position:absolute;width:1px;left:50%;top:-4px;bottom:-4px;background:#779087}.dot{position:absolute;width:20px;height:20px;top:-4px;transform:translateX(-50%);border-radius:50%;background:var(--green);border:3px solid white;box-shadow:0 0 0 1px var(--green)}.ends{display:flex;justify-content:space-between;font-size:14px}.de{font-size:20px;margin:8px 0 0}.reportbox{margin-top:34px;padding:24px;background:var(--soft);border-radius:12px}.reportbox p{margin:10px 0}.guide{border-bottom:1px solid var(--line);padding:18px 0}.guide strong{font-size:20px}footer{font-size:13px;color:var(--muted);margin-top:45px;border-top:1px solid var(--line);padding-top:18px}a{color:var(--green)}[hidden]{display:none!important}.printonly{display:none}
@media(max-width:700px){main{padding:28px 20px 50px}header{padding:18px 20px}.split{grid-template-columns:1fr;gap:20px}.options{gap:5px}.choice{padding:14px 3px;font-size:14px}.pair{gap:18px}.pair p{font-size:18px}.dimtop{align-items:start;flex-direction:column;gap:4px}.type{font-size:52px}.lead{font-size:19px}}
@media print{body{background:white;font-size:12px}header,.actions,.nav,.backlink,footer,.noprint{display:none!important}main{padding:0;max-width:none}h1{font-size:28px;margin:5px 0}h2{font-size:21px}.type{font-size:36px}.dimension{padding:10px 0;break-inside:avoid}.reportbox{background:none;border:1px solid #bbb;padding:12px;break-inside:avoid}.de{font-size:15px}.printonly{display:block}}
</style></head><body><header><strong>认识彼此 <span class="muted">/ Persönlichkeit</span></strong><button class="plain" id="guideBtn">教师用法</button></header><main id="main" tabindex="-1"></main>
<script>
'use strict';
const questions=[
['EI','新同学见面','认识一群新同学时，你更自然地……','主动和几个人聊起来','先观察，再和一两个人深入聊',1],
['SN','学习新任务','学习一个新任务，你更想先看到……','它能延伸出哪些想法','具体例子和操作步骤',-1],
['TF','讨论分歧','两位室友的意见冲突时，你先关注……','各自的感受和关系','双方理由是否一致、是否公平',-1],
['JP','周末安排','一个普通周末，你更喜欢……','提前大致确定活动和时间','先留空，看当天想做什么',1],
['EI','一天结束','社交了一天之后，你通常更想……','独自待一会儿恢复精力','再和熟悉的人聊聊放松',-1],
['SN','了解一间房','看一套房子的介绍时，你先注意……','面积、采光和已有设施','空间将来能怎样布置和使用',1],
['TF','公共开支','商量一笔公共费用时，你倾向先考虑……','用什么统一原则分摊','每个人目前的处境和负担',1],
['JP','计划变化','原定活动突然取消，你通常……','很容易转向临时的新安排','想尽快重新确定一个计划',-1],
['EI','理清想法','遇到一个新想法，你更常……','边和别人聊，边想清楚','先自己想清楚，再说出来',1],
['SN','听一个故事','听完一个故事，你更容易继续想……','它暗示的主题和其他可能','事情具体怎样发生的',-1],
['TF','给出反馈','朋友请你评价方案时，你更自然地先……','指出方案的逻辑和可行性','考虑怎样说对方更容易接受',1],
['JP','共同任务','接到小组任务，你更喜欢……','先探索几种可能，再决定步骤','先确定分工和时间节点',-1],
['EI','来到聚会','进入不太熟悉的聚会时，你更喜欢……','先找一个位置，慢慢加入交流','主动加入对话、认识新人',-1],
['SN','选择课程','两门课程都合适时，你更被什么吸引……','能学到具体、可应用的知识','能探索新概念和不同可能',1],
['TF','制定规则','一条规则给某位室友带来困难时，你先想……','怎样照顾这个人的具体需要','改变规则后，对所有人是否一致',-1],
['JP','准备出行','出发前，你更舒服的状态是……','关键事项已经安排妥当','保留较多现场选择的空间',1],
['EI','轻松的晚上','没有其他约束时，你更想……','独处或和很少的人待着','参加有几个人一起的活动',-1],
['SN','谈论生活','闲聊时，你更容易被什么带动……','还没发生的设想和新点子','最近发生的事和具体经验',-1],
['TF','作出选择','两种方案各有利弊时，你通常先问……','哪一种理由更充分、标准更一致','哪一种更符合在场者重视的事情',1],
['JP','做一个决定','信息已经够用时，你更喜欢……','再留一点时间，看看其他选择','作出决定，推进下一步',-1],
['EI','课堂讨论','准备程度相同时，你更常……','通过轮流发言来整理思路','先安静思考，再作一次较完整发言',1],
['SN','解决问题','遇到不熟悉的问题时，你更自然地……','先找已有事实和可参考的做法','先设想新的解释和不同路径',1],
['TF','倾听烦恼','朋友讲了一件烦心事，你第一反应更接近……','理解对方为什么难受','分析问题，帮助寻找原因',-1],
['JP','日常节奏','没有外部要求时，你更喜欢……','生活有一定的顺序和安排','按当下状态灵活调整',1]
];
const dims=[
{key:'EI',left:'E',right:'I',name:'交流与恢复精力',l:'互动中整理思路',r:'独处中整理思路',deL:'Ich tausche mich gern mit anderen aus.',deR:'Ich brauche auch Zeit für mich.',zhL:'我喜欢与别人交流。',zhR:'我也需要独处的时间。',prompt:'想聊天的时候，怎样确认对方也愿意？'},
{key:'SN',left:'S',right:'N',name:'留意与获取信息',l:'事实与具体经验',r:'联系与新的可能',deL:'Konkrete Beispiele helfen mir.',deR:'Ich denke gern über neue Möglichkeiten nach.',zhL:'具体例子对我有帮助。',zhR:'我喜欢思考新的可能。',prompt:'讨论同一间房时，你们是否关注了不同信息？'},
{key:'TF',left:'T',right:'F',name:'权衡与作出决定',l:'一致原则与逻辑',r:'价值与人的处境',deL:'Klare und faire Regeln sind mir wichtig.',deR:'Mir ist wichtig, wie es anderen dabei geht.',zhL:'明确、公平的规则对我很重要。',zhR:'我重视别人在这件事中的感受。',prompt:'怎样把共同规则和个人需要一起考虑？'},
{key:'JP',left:'J',right:'P',name:'安排外部生活',l:'安排与确定',r:'弹性与开放',deL:'Ich plane gern im Voraus.',deR:'Ich bleibe gern flexibel.',zhL:'我喜欢提前计划。',zhR:'我喜欢保持灵活。',prompt:'哪些事情要事先约定，哪些可以临时决定？'}
];
let answers=Array(24).fill(null),current=0,mode='self',view='home',returnView='home';
const main=document.querySelector('#main');
function el(tag,attrs={},content=''){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else e.setAttribute(k,v)}if(content)e.textContent=content;return e}
function btn(label,fn,cls=''){const b=el('button',{class:cls},label);b.onclick=fn;return b}
function focusMain(){main.focus({preventScroll:true});window.scrollTo(0,0)}
function home(){view='home';main.innerHTML='<div class="split"><section><div class="eyebrow">MBTI 四维框架 · 课堂探索</div><h1>先认识自己，<br>再认识彼此。</h1><p class="lead">遇到差异时，你习惯怎样交流、获取信息、作出决定和安排生活？用24个小情境，开启一段对话。</p><p class="muted">约5分钟 · 无需姓名 · 可离线使用</p><fieldset class="mode"><legend>这次，你想从谁的角度回答？</legend><select id="mode"><option value="self">按我自己通常的偏好</option><option value="role">代入我抽到的合租角色</option></select></fieldset><div id="startActions" class="actions"></div><p class="note">按“通常更自然的选择”回答，不按“应该怎样”作答。没有正确答案，也可以选择两者差不多。</p></section><aside class="aside"><h3>一次探索，不是一张标签</h3><p>本应用使用原创题目，借用MBTI的四个偏好维度。它不是官方MBTI量表，未经心理测量验证，结果只供课堂讨论。</p><p>字母不能代表能力、品德，也不能判断谁适合与你合租。</p><p>答案只在当前页面内存中处理，不上传、不自动保存。刷新页面会清除进度；无需公开结果。</p></aside></div>';document.querySelector('#mode').value=mode;document.querySelector('#mode').onchange=e=>mode=e.target.value;document.querySelector('#startActions').append(btn(answers.some(x=>x!==null)?'重新开始':'开始探索',()=>{answers=Array(24).fill(null);current=0;quiz();focusMain()},'primary'));if(answers.some(x=>x!==null))document.querySelector('#startActions').append(btn('继续上次进度',()=>{current=answers.findIndex(x=>x===null);if(current<0)results();else quiz();focusMain()}));footer()}
function footer(){const f=el('footer');f.innerHTML='汤勇老师制作 · 跨文化交际课堂<br>框架参考：<a href="https://www.myersbriggs.org/my-mbti-personality-type/myers-briggs-overview/" target="_blank" rel="noopener">Myers &amp; Briggs Foundation 四维说明</a> · <a href="https://www.themyersbriggs.com/en-US/Support/MBTI-Facts" target="_blank" rel="noopener">使用边界</a>';main.append(f)}
function quiz(){view='quiz';const q=questions[current];main.innerHTML='<div class="qmeta"><span id="counter"></span><span id="modeLabel"></span></div><progress max="24"></progress><p class="situation"></p><h2>哪一种更接近你通常的偏好？</h2><p id="context" class="muted"></p><div class="pair"><div><strong>A</strong><p id="a"></p></div><div><strong>B</strong><p id="b"></p></div></div><div class="options" role="group" aria-label="选择更接近你的描述"></div><p class="note">“差不多”表示两种方式都适合你，或要看情况。</p><div class="nav"></div>';document.querySelector('#counter').textContent='第 '+(current+1)+' / 24 题';document.querySelector('#modeLabel').textContent=mode==='self'?'回答自己的偏好':'代入虚构角色';document.querySelector('progress').value=current;document.querySelector('.situation').textContent=q[1];document.querySelector('#context').textContent=q[2];document.querySelector('#a').textContent=q[3];document.querySelector('#b').textContent=q[4];const options=document.querySelector('.options');[-2,-1,0,1,2].forEach((v,i)=>{let b=btn(['更像 A','稍像 A','差不多','稍像 B','更像 B'][i],()=>{answers[current]=v;quiz()});b.className='choice';b.setAttribute('aria-pressed',String(answers[current]===v));options.append(b)});const nav=document.querySelector('.nav');let back=btn('上一题',()=>{current--;quiz();focusMain()});back.disabled=current===0;let next=btn(current===23?'查看我的结果':'下一题',()=>{if(current===23)results();else{current++;quiz()}focusMain()},'primary');next.disabled=answers[current]===null;nav.append(back,next);const link=el('div',{class:'backlink'});link.append(btn('返回首页（保留当前进度）',()=>{home();focusMain()},'plain'));main.append(link)}
function score(a){return dims.map(d=>{let s=0;questions.forEach((q,i)=>{if(q[0]===d.key)s+=-a[i]*q[5]});return{...d,sum:s,letter:s===0?'X':s>0?d.left:d.right,position:50-s/12*50,near:Math.abs(s)<=2}})}
function results(){if(answers.some(x=>x===null))return;view='result';const r=score(answers),type=r.map(d=>d.letter).join('');main.innerHTML='<div class="eyebrow">你的课堂探索记录</div><h1>偏好可以不同，<br>生活可以协商。</h1><p id="resultmode" class="muted"></p><div class="type"></div><p class="resultlead">这是本次原创问卷的四维代号，不是官方MBTI类型认定。X表示本次回答在该维度恰好平衡。靠近中间时，可以继续探索，不必急着选边。</p><p class="note">圆点只表示本次回答的计分位置，不是人格强度、百分位或测量置信度。</p><div id="dimensions"></div><section class="reportbox"><h3>把结果变成可以说出口的话</h3><div id="german"></div></section><section class="reportbox"><h3>回到合租屋</h3><p>选一条你真正重视的生活需要，向室友说明；再问对方需要什么。</p><p class="de">Mir ist … wichtig. Wie ist das bei dir?</p><p class="note">我重视……你呢？</p><p>不要按四字母筛室友。试着了解具体习惯，并谈出一条双方接受的约定。</p><p>比较自己和角色时：结果哪里不同？环境、经历或文化背景可能怎样影响回答？</p></section><div class="actions" id="resultActions"></div>';document.querySelector('#resultmode').textContent=mode==='self'?'按自己的偏好作答':'按虚构角色作答，不描述本人';document.querySelector('.type').textContent=type;r.forEach(d=>{const box=el('section',{class:'dimension'});const top=el('div',{class:'dimtop'});top.append(el('b',{},d.name),el('span',{},d.sum===0?'两侧平衡':(d.near?'接近中间，略偏 ':'本次偏向 ')+d.letter));const tr=el('div',{class:'track'});const dot=el('span',{class:'dot'});dot.style.left=d.position+'%';tr.append(dot);const ends=el('div',{class:'ends'});ends.append(el('span',{},d.left+' · '+d.l),el('span',{},d.right+' · '+d.r));box.append(top,tr,ends,el('p',{class:'note'},d.prompt));document.querySelector('#dimensions').append(box);const lang=el('div');lang.append(el('p',{class:'de'},d.sum===0?'Je nach Situation brauche ich beides.':d.sum>0?d.deL:d.deR),el('p',{class:'note'},d.sum===0?'视情况而定，两种方式我都需要。':d.sum>0?d.zhL:d.zhR));document.querySelector('#german').append(lang)});const actions=document.querySelector('#resultActions');actions.append(btn('打印 / 保存为PDF',()=>window.print(),'primary'),btn('下载我的记录',()=>download(r)),btn('回看答案',()=>{current=0;quiz();focusMain()}),btn('换一个角度再试',()=>{mode=mode==='self'?'role':'self';home();focusMain()}));footer()}
function download(r){const record={title:'课堂四维偏好探索（非官方量表）',mode:mode==='self'?'自己的偏好':'虚构角色',date:new Date().toISOString(),code:r.map(d=>d.letter).join(''),dimensions:r.map(d=>({dimension:d.key,sum:d.sum,range:[-12,12],letter:d.letter})),answers:questions.map((q,i)=>({number:i+1,context:q[2],a:q[3],b:q[4],answer:answers[i]}))};let blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=el('a',{href:u,download:'课堂性格探索记录.json'});a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function guide(){returnView=view;view='guide';main.innerHTML='<div class="eyebrow">教师用法</div><h1>给合租活动，加一面镜子。</h1><section class="guide"><strong>01　自己答，约5分钟</strong><p>学生按通常的偏好独立作答。结果由本人保留，自愿分享。先不按类型分组，不比较哪种类型更好。</p></section><section class="guide"><strong>02　自由找室友，约15分钟</strong><p>继续使用28张虚构角色卡，按角色说明介绍优缺点，四人自由组合。测试结果不替代对具体生活习惯的了解。</p></section><section class="guide"><strong>03　作一次比较，约5分钟</strong><p>你本人的偏好与所扮演角色哪里不同？“安静”是否总等于内向？“爱干净”是否就能决定J/P？只凭一项习惯能不能给人定型？</p></section><section class="guide"><strong>可选：代入角色再答</strong><p>如果角色卡没有提供足够信息，可以选择“差不多”，并指出还需要了解什么。不要为了凑出四字母而编造判断。</p></section><section class="guide"><strong>评分与边界</strong><p>不按测试代号、作答内容或是否公开结果评分。课堂可以观察提问、倾听和协商表现。本原创问卷未经验证，只用于引出讨论，不用于诊断、能力评价或筛选室友。</p></section><div class="actions" id="guideActions"></div>';document.querySelector('#guideActions').append(btn('返回活动',()=>{if(returnView==='quiz')quiz();else if(returnView==='result')results();else home();focusMain()},'primary'));footer();focusMain()}
document.querySelector('#guideBtn').onclick=guide;home();
</script></body></html>
