<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>课堂点名与分组 · 汤勇</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f4ed;color:#193e32;font-family:system-ui,'Microsoft YaHei',sans-serif}header{padding:28px 5vw;display:flex;align-items:center;justify-content:space-between}header strong{font-size:23px}button{font:inherit;cursor:pointer;border:1px solid #cbd6c5;border-radius:12px;background:white;color:inherit;padding:12px 20px}button:hover{background:#e4eddd}button:disabled{cursor:default;opacity:.6}main{max-width:1100px;margin:auto;padding:24px}.tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.tabs button.active{background:#214d3c;color:white;border-color:#214d3c}.stage{margin-top:30px;border:1px solid #d6e0cc;border-radius:32px;background:#e5eddb;text-align:center;padding:48px 24px 40px;min-height:540px;display:flex;flex-direction:column;align-items:center;justify-content:center}.label{font-size:16px;color:#607358;letter-spacing:2px}h1{font-size:clamp(22px,4vw,34px);margin:14px 0}.name{font-size:clamp(64px,13vw,130px);font-weight:750;line-height:1.4;margin:35px 0;min-height:1.4em}.draw{background:#214d3c;color:white;border:0;font-size:24px;padding:17px 65px;min-width:240px}.draw:hover{background:#32634c}.status{margin-top:20px;color:#63785c;font-size:15px;min-height:24px}footer{text-align:center;color:#819079;font-size:13px;margin-top:26px}body:fullscreen{overflow:auto}body:fullscreen main{max-width:1300px}body:fullscreen .stage{min-height:68vh}@media(max-width:600px){header{padding:22px}main{padding:12px}.tabs button{font-size:14px;padding:10px}.stage{margin-top:20px;min-height:480px;padding:30px 12px}header strong{font-size:19px}}
.groupbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}.groupbar button.active{background:#214d3c;color:white}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:24px}.group{background:white;border:1px solid #d6e0cc;border-radius:18px;padding:20px;line-height:1.9;font-size:21px}.group strong{display:block;font-size:14px;color:#6a805e;margin-bottom:8px}.groups h2{grid-column:1/-1;font-size:19px;margin:0}.groupbar button:disabled{opacity:.5}@media print{header,.tabs,.stage,.groupbar,footer{display:none}.groups{display:grid;grid-template-columns:repeat(3,1fr)}.group{break-inside:avoid;color:black;border:1px solid #aaa;font-size:17px}body{background:white}}
</style><header><strong>课堂点名与分组</strong><button id="full">全屏投影</button></header><main><nav class="tabs" id="tabs" aria-label="选择课程"></nav><section class="stage"><div class="label">ZUFALLSAUSWAHL</div><h1 id="course"></h1><div class="label" id="size"></div><div class="name" id="name" aria-live="polite">准备好了吗</div><button class="draw" id="draw">开始点名</button><div class="status" id="status" role="status">姓名闪动 8 秒后，自动停下</div></section><div class="groupbar" aria-label="随机分组"><button id="g2">两人一组</button><button id="g3">三人一组</button><button id="g4">四人一组</button></div><div id="groupHint" style="text-align:center;color:#63785c;font-size:14px">点击上方选项，随机分组；余下的人自动成一组</div><section class="groups" id="groups" aria-live="polite"></section><footer>汤勇老师制作 · 按空格键开始 · 每次从本课程全体学生中随机抽取，可重复抽中</footer></main><script>
const courses=[{"title": "初级德语视听说", "names": ["刘旭升", "杨晓如", "彭正凯", "赵琦胜", "洪云仪", "蔡梓铃", "张桂萌", "陈悦理", "何诚涵", "周靖", "李煜", "严莉淇", "陈贝", "刘泳儿", "康佳敏", "余凯琳", "廖俊贤", "翁好", "温宇琳", "张家敏", "刘晓祺", "刘昕杨", "孙兆仪", "赵苗", "杨雨涵", "邱潮彬", "莫繁阳", "张丽平"]}, {"title": "高级德语视听说", "names": ["林耀聪", "周琳琳", "莫子源", "张懿薇", "郑子珑", "肖俏妍", "王思琪", "陈宇", "李宗耘", "刘致远", "刘简嘉", "黄锦琪", "李思娴", "陈怡伶", "廖碧怡", "周安帮", "符锦鹏", "叶颖茵", "刘舒纬", "杨心怡", "马世权", "余洋", "叶梓坩", "王秋榕", "孙志杭", "王硕", "张新炜", "杨志豪"]}, {"title": "德语基础（华侨城）", "names": ["杨旭", "吴锶静", "潘小路", "陈健茹", "邹楷敏", "朱舞阳", "刘宇婷", "艾诗璟", "高毅", "余婉欣", "刘淑齐", "王仪仪", "黄卓盈", "罗浤恩", "杨孜孜", "刘慧君", "王沁萍", "蔡钰玲", "徐子珊", "蒲祥丽", "农玉凤", "侯思莹", "黄米可", "李乐瑶", "陈雨晨", "蔡宇心", "钟欣彤", "曾文静", "郝珂萱", "黄韵如", "邓厚悦", "邹欣"]}, {"title": "跨文化交际", "names": ["林耀聪", "周琳琳", "莫子源", "张懿薇", "郑子珑", "肖俏妍", "王思琪", "陈宇", "李宗耘", "刘致远", "刘简嘉", "黄锦琪", "李思娴", "陈怡伶", "廖碧怡", "周安帮", "符锦鹏", "叶颖茵", "刘舒纬", "杨心怡", "马世权", "余洋", "叶梓坩", "王秋榕", "孙志杭", "王硕", "张新炜", "杨志豪"]}];
const $=id=>document.getElementById(id);let current=0,busy=false;const tabs=[];
function randomIndex(n){const bytes=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(bytes)}while(bytes[0]>=limit);return bytes[0]%n}
function selectCourse(i){if(busy)return;current=i;tabs.forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',String(i===j))});$('groups').replaceChildren();$('groupHint').textContent='点击上方选项，随机分组；余下的人自动成一组';$('course').textContent=courses[i].title;$('size').textContent='共 '+courses[i].names.length+' 位同学';$('name').textContent='准备好了吗';$('status').textContent='姓名闪动 8 秒后，自动停下'}
courses.forEach((course,i)=>{const b=document.createElement('button');b.textContent=course.title;b.onclick=()=>selectCourse(i);tabs.push(b);$('tabs').append(b)});
function draw(){if(busy)return;busy=true;[2,3,4].forEach(n=>$('g'+n).disabled=true);tabs.forEach(b=>b.disabled=true);$('draw').disabled=true;$('draw').textContent='正在抽取…';$('name').setAttribute('aria-live','off');const names=courses[current].names,winner=names[randomIndex(names.length)],start=performance.now();let previous='';function flash(){let next=names[randomIndex(names.length)];if(next===previous&&names.length>1)next=names[(names.indexOf(next)+1)%names.length];previous=next;$('name').textContent=next;const elapsed=performance.now()-start;$('status').textContent='随机点名中 · '+Math.max(1,Math.ceil((8000-elapsed)/1000))+' 秒'}flash();const interval=setInterval(flash,85);setTimeout(()=>{clearInterval(interval);$('name').setAttribute('aria-live','polite');$('name').textContent=winner;$('status').textContent='点到的同学是：'+winner;$('draw').textContent='再抽一位';$('draw').disabled=false;tabs.forEach(b=>b.disabled=false);[2,3,4].forEach(n=>$('g'+n).disabled=false);busy=false},8000)}
function makeGroups(names,size){const shuffled=names.slice();for(let i=shuffled.length-1;i>0;i--){const j=randomIndex(i+1);[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}const groups=[];for(let i=0;i<shuffled.length;i+=size)groups.push(shuffled.slice(i,i+size));return groups}
function group(size){if(busy)return;const result=makeGroups(courses[current].names,size);$('groups').replaceChildren();const title=document.createElement('h2');title.textContent=courses[current].title+' · '+size+'人一组 · 共'+result.length+'组';$('groups').append(title);result.forEach((members,i)=>{const card=document.createElement('div');card.className='group';const label=document.createElement('strong');label.textContent='第 '+(i+1)+' 组'+(members.length<size?'（余下 '+members.length+' 人）':'');const names=document.createElement('div');names.textContent=members.join('、');card.append(label,names);$('groups').append(card)});$('groupHint').textContent='分组完成 · 每人只出现一次 · 再点一次可重新随机分组'}
[2,3,4].forEach(size=>$('g'+size).onclick=()=>group(size));
$('draw').onclick=draw;document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['BUTTON','INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();draw()}});$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('status').textContent='可使用浏览器菜单开启全屏'}};selectCourse(0);
</script></html>
